<!DOCTYPE html>

<head>

<title>Ernährung Know-how</title>
<style>
:root{--navy:#001965;--accent:#005AD2;--ink:#1F2A44;--muted:#5B6577;--bg:#F5F7FB;--card:#fff;--line:#E2E8F2}
@media (prefers-color-scheme:dark){:root{--navy:#9DB8FF;--accent:#6EA2FF;--ink:#E6EBF5;--muted:#A7B0C2;--bg:#0F1524;--card:#18213A;--line:#2A3654}}
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding:20px}
.box{width:100%;max-width:380px;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:28px 24px;text-align:center}
img{width:72px;height:72px;border-radius:16px}h1{font-size:21px;color:var(--navy);margin:14px 0 4px}p{margin:0 0 16px;color:var(--muted);font-size:14.5px}
input[type=password],input[type=text]{width:100%;padding:12px 14px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);font-size:16px}
button{width:100%;margin-top:12px;padding:12px;border:0;border-radius:10px;background:var(--accent);color:#fff;font-size:16px;font-weight:600;cursor:pointer}button:disabled{opacity:.6}
label{display:flex;gap:8px;align-items:center;justify-content:center;margin-top:14px;font-size:13.5px;color:var(--muted)}
#msg{min-height:20px;margin-top:10px;font-size:14px;color:#C0392B}
</style>
</head>
<body>
<form class="box" id="f" autocomplete="off">
<img src="icons/icon-192.png" alt="">
<h1>Ernährung Know-how</h1>
<p>Testversion. Bitte Passwort eingeben.<br>Test version. Please enter the password.</p>

<button id="go" type="submit">Öffnen / Open</button>

<div id="msg" role="alert"></div>
</form>
